name: smoke
on:
  push:
    branches: [ 'arena/**' ]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: java -version
      - run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME" 2>/dev/null | head
      - run: ls "$ANDROID_HOME/platforms" 2>/dev/null; ls "$ANDROID_HOME/build-tools" 2>/dev/null
      - run: gradle --version || true
      - run: curl -sI https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.5.2/gradle-8.5.2.pom | head -3
